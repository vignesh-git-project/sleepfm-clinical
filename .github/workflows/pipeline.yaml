name: SleepFM Pi Pipeline

on:
  workflow_dispatch:
    inputs:
      data_folder:
        description: 'Target subfolder inside data/ (e.g., subject_01, baseline_night)'
        required: true
        default: 'subject_01'
        type: string

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install mne pandas numpy scikit-learn h5py

      - name: Execute Pipeline for Selected Cohort
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_pi_pipeline.py \
            --input_dir "data/${{ github.event.inputs.data_folder }}" \
            --output_dir "outputs/${{ github.event.inputs.data_folder }}"

      - name: Upload Cohort Clinical Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: sleepfm-report-${{ github.event.inputs.data_folder }}
          path: |
            outputs/${{ github.event.inputs.data_folder }}/*.html
            outputs/${{ github.event.inputs.data_folder }}/*.csv
            outputs/${{ github.event.inputs.data_folder }}/*.png
          retention-days: 14
