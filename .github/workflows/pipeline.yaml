name: SleepFM Pi Pipeline

on:
  push:
    paths:
      - 'data/csv/**'
      - 'scripts/run_pi_pipeline.py'
      - '*.py'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install mne pandas numpy scikit-learn h5py

      - name: Execute Pipeline
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_pi_pipeline.py --input_dir data/csv --output_dir outputs/pi_device

      - name: Upload Clinical Dashboard and Reports
        uses: actions/upload-artifact@v4
        with:
          name: sleepfm-dashboard-report
          path: |
            outputs/pi_device/*.html
            outputs/pi_device/*.csv
            outputs/pi_device/*.png
          retention-days: 14
